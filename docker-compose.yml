name: notka

# Production-shaped by default: the app listens on the host's loopback only and expects a
# TLS-terminating reverse proxy on the same host in front of it (see deploy/Caddyfile.example).
# For a quick local try-out, http://localhost:8080 works as it is — browsers accept a Secure cookie
# on localhost.

services:
  notka:
    build:
      context: .
      dockerfile: Dockerfile
    image: notka:latest
    container_name: notka
    env_file:
      - .env
    restart: unless-stopped
    ports:
      # Loopback only: nothing but the reverse proxy on this host can reach the app directly, which
      # is also what makes trusting its X-Forwarded-For safe. Set NOTKA_BIND=0.0.0.0 only if the
      # proxy runs on another machine, and then firewall the port to that machine.
      - "${NOTKA_BIND:-127.0.0.1}:${NOTKA_HTTP_PORT:-8080}:8080"
    environment:
      NOTKA_PORT: "8080"
      NOTKA_HOST: "0.0.0.0"
      NOTKA_DB_PATH: "/data/notka.db"
      NOTKA_STATIC_DIR: "/app/static"
      # The session cookie is only ever sent over HTTPS. Set to "false" only for plain http on a
      # host name other than localhost, which is not something to run in production.
      NOTKA_COOKIE_SECURE: "${NOTKA_COOKIE_SECURE:-true}"
      # The reverse proxy in front of the container reports the real client address; the sign-in
      # rate limit is keyed by it.
      NOTKA_TRUST_PROXY_HEADERS: "${NOTKA_TRUST_PROXY_HEADERS:-true}"
      # The administrator, created on the FIRST start only (required then). Afterwards these are
      # ignored; take the password out of .env once the instance is up. Sign-up starts closed — the
      # administrator opens it in the gear menu's "Server settings".
      NOTKA_ADMIN_USERNAME: "${NOTKA_ADMIN_USERNAME:-}"
      NOTKA_ADMIN_PASSWORD: "${NOTKA_ADMIN_PASSWORD:-}"
      NOTKA_ADMIN_EMAIL: "${NOTKA_ADMIN_EMAIL:-}"
      # The address people reach the instance at; links in e-mails are built from it.
      NOTKA_PUBLIC_URL: "${NOTKA_PUBLIC_URL:-}"
      # Sign-in through an OpenID Connect provider, next to passwords. Empty issuer: passwords only.
      NOTKA_OIDC_ISSUER: "${NOTKA_OIDC_ISSUER:-}"
      NOTKA_OIDC_CLIENT_ID: "${NOTKA_OIDC_CLIENT_ID:-}"
      NOTKA_OIDC_CLIENT_SECRET: "${NOTKA_OIDC_CLIENT_SECRET:-}"
      NOTKA_OIDC_NAME: "${NOTKA_OIDC_NAME:-SSO}"
      # Outgoing mail, for password resets. Without NOTKA_SMTP_HOST nothing is sent.
      NOTKA_SMTP_HOST: "${NOTKA_SMTP_HOST:-}"
      NOTKA_SMTP_PORT: "${NOTKA_SMTP_PORT:-}"
      NOTKA_SMTP_SECURITY: "${NOTKA_SMTP_SECURITY:-starttls}"
      NOTKA_SMTP_USERNAME: "${NOTKA_SMTP_USERNAME:-}"
      NOTKA_SMTP_PASSWORD: "${NOTKA_SMTP_PASSWORD:-}"
      NOTKA_SMTP_FROM: "${NOTKA_SMTP_FROM:-}"
      NOTKA_SMTP_FROM_NAME: "${NOTKA_SMTP_FROM_NAME:-Notka}"
      # Ceiling on how many notes one account may own, trash included.
      NOTKA_MAX_NOTES_PER_USER: "${NOTKA_MAX_NOTES_PER_USER:-10000}"
      # Picture storage of the notes one account owns, in MB.
      NOTKA_MAX_IMAGE_STORAGE_MB: "${NOTKA_MAX_IMAGE_STORAGE_MB:-1024}"
      NOTKA_SESSION_TTL_DAYS: "${NOTKA_SESSION_TTL_DAYS:-30}"
      NOTKA_TRASH_RETENTION_DAYS: "${NOTKA_TRASH_RETENTION_DAYS:-30}"
      NOTKA_MAX_NOTE_BYTES: "${NOTKA_MAX_NOTE_BYTES:-65536}"
      NOTKA_LOG_LEVEL: "${NOTKA_LOG_LEVEL:-INFO}"
      # "true" starts a demo instance: two sample accounts and their notes on an empty database;
      # Alice is its administrator.
      DEMO: "${DEMO:-false}"
    volumes:
      - notka-data:/data
    # Hardening: the image's files cannot be changed, the process can never gain privileges, and it
    # keeps no Linux capabilities at all (it binds an unprivileged port). /tmp stays writable and
    # executable because the SQLite driver unpacks its native library there.
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: "${NOTKA_MEMORY_LIMIT:-512m}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  notka-data:
    name: notka-data
